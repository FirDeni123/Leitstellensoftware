<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Strict CSP: no remote scripts, no eval. connect-src allows the configurable server
         and map tiles (http/https + ws/wss; MapLibre loads tiles via fetch). The MapLibre
         worker is a bundled file ('self'); blob: is needed for decoded tile images. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <title>ILS-Sim Leitstelle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
