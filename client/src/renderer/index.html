<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Strict CSP: no remote scripts, no eval. connect-src allows the configurable server
         (http/https + ws/wss). Map tiles (phase 6) will be added to img-src explicitly. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <title>ILS-Sim Leitstelle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
