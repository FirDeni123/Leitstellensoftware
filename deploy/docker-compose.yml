# ILS-Sim – Serverbetrieb auf Ubuntu (Docker Compose)
#
#   cp .env.example .env   # Werte setzen (scripts/install-ubuntu.sh erzeugt Geheimnisse)
#   docker compose up -d
#
# Dienste: PostgreSQL (Daten), Redis (Echtzeit-Bus zwischen API-Prozessen), API, Caddy (TLS),
# optional OSRM (Routing, Profil "routing").
# Nur Caddy ist von außen erreichbar (Port 443). Datenbank und Redis bleiben im internen Netz.

name: ils-sim

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ils
      POSTGRES_USER: ils
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ils -d ils"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    build: ../server
    image: ils-sim/server:${ILS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ILS_ENVIRONMENT: production
      ILS_DATABASE_URL: postgresql+asyncpg://ils:${POSTGRES_PASSWORD}@db:5432/ils
      ILS_REDIS_URL: redis://redis:6379/0
      ILS_JWT_SECRET: ${ILS_JWT_SECRET:?ILS_JWT_SECRET fehlt}
      ILS_ENCRYPTION_KEYS: ${ILS_ENCRYPTION_KEYS:?ILS_ENCRYPTION_KEYS fehlt}
      ILS_TRUSTED_PROXY_COUNT: "1"
      ILS_WORKERS: ${ILS_WORKERS:-2}
      ILS_CORS_ORIGINS: '["app://ils"]'
      # Routing for travel times and simulated drives; empty = straight-line estimate.
      ILS_OSRM_URL: ${ILS_OSRM_URL:-}
      ILS_MAP_TILE_URL: ${ILS_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      ILS_MAP_TILE_ATTRIBUTION: ${ILS_MAP_TILE_ATTRIBUTION:-© OpenStreetMap-Mitwirkende}
    networks: [backend]

  # Optional (profile "routing"): OSRM with a prepared regional extract, see
  # scripts/prepare-osrm.sh. Start with: docker compose --profile routing up -d
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [routing]
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "1000", "/data/region.osrm"]
    volumes:
      - ./osrm-data:/data:ro
    networks: [backend]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${ILS_HTTPS_PORT:-443}:443"
    environment:
      ILS_SERVER_NAME: ${ILS_SERVER_NAME:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [backend]

volumes:
  db-data:
  caddy-data:

networks:
  backend:
